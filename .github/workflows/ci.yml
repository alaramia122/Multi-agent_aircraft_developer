name: CI

on:
  push:
    branches: [main, "infrastructure/**"]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Install development tools
        run: python -m pip install pytest httpx ruff mypy
      - name: Apply Ruff fixes during infrastructure cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/infrastructure/canonical-persistence'
        run: |
          ruff check . --fix --unsafe-fixes || true
          ruff format .
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "style: apply Ruff fixes"
          git push
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q
