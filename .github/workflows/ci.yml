name: CI

on:
  push:
    branches: [main, "infrastructure/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Install development tools
        run: python -m pip install 'pytest>=8.3,<9.0' 'pytest-asyncio>=0.24,<1.0' 'httpx>=0.27,<1.0' 'ruff>=0.16.8,<0.17.0' 'mypy>=1.13,<2.0'

      - name: Verify PostgreSQL service
        env:
          PGPASSWORD: postgres
        run: pg_isready --host=localhost --port=5432 --username=postgres --dbname=postgres

      - name: Initialize PostgreSQL test schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          shopt -s nullglob
          bootstrap=(migrations/versions/*.sql)
          active=(migrations/*.sql)
          ((${#bootstrap[@]} == 2))
          ((${#active[@]} > 0))
          for migration in "${bootstrap[@]}"; do
            psql --set ON_ERROR_STOP=1 --host=localhost --username=postgres --dbname=postgres --file="$migration"
          done
          for migration in "${active[@]}"; do
            psql --set ON_ERROR_STOP=1 --host=localhost --username=postgres --dbname=postgres --file="$migration"
          done

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore


  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Validate Yandex VM staging configuration
        run: >-
          docker compose
          --env-file deploy/yandex-vm/.env.example
          -f deploy/yandex-vm/compose.yml
          config --quiet

      - name: Validate Yandex VM Caddy configuration
        run: >-
          docker run --rm
          --env-file deploy/yandex-vm/.env.example
          --volume "$PWD/deploy/yandex-vm/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Build and start staging stack
        env:
          POSTGRES_PASSWORD: postgres
        run: docker compose -f docker-compose.staging.yml up --build --detach

      - name: Wait for Gateway
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml ps
          docker compose -f docker-compose.staging.yml logs --no-color gateway migrate
          exit 1

      - name: Run staging smoke test
        env:
          GATEWAY_URL: http://127.0.0.1:8000
        run: python scripts/staging_smoke.py

      - name: Show staging logs on failure
        if: failure()
        run: docker compose -f docker-compose.staging.yml logs --no-color

      - name: Stop staging stack
        if: always()
        run: docker compose -f docker-compose.staging.yml down --volumes
