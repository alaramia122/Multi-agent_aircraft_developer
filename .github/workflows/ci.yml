name: CI

on:
  push:
    branches: [main, "infrastructure/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Install development tools
        run: python -m pip install 'pytest>=8.3,<9.0' 'pytest-asyncio>=0.24,<1.0' 'httpx>=0.27,<1.0' 'ruff>=0.8,<1.0' 'mypy>=1.13,<2.0'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q
