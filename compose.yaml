name: engineering-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engineering_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - gateway-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - gateway-internal

  migrate:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-engineering_gateway}
      PGUSER: ${POSTGRES_USER:-gateway}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./migrations:/migrations:ro
      - ./deployment/apply-migrations.sh:/usr/local/bin/apply-migrations:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/apply-migrations"]
    networks:
      - gateway-internal

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_NAME: engineering-gateway
      APP_ENV: staging
      APP_VERSION: 0.2.0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-engineering_gateway}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_ACTOR_ID: ${MCP_ACTOR_ID:-staging-readonly-agent}
      MCP_ACTOR_TYPE: ai
      MCP_AUTHORIZATION_LEVEL: L0_READ
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - gateway-internal

volumes:
  gateway-postgres-data:

networks:
  gateway-internal:
    driver: bridge
